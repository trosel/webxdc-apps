<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Apps</title>
  <style>
    :root {
      --bg: #fafaf7;
      --fg: #1a1a1a;
      --muted: #666;
      --card: #ffffff;
      --border: #e5e3dc;
      --accent: #2d6a4f;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15171a;
        --fg: #ececec;
        --muted: #9aa0a6;
        --card: #1e2125;
        --border: #2a2e34;
        --accent: #7bbf9e;
        --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.25);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }
    ul.apps {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .card {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 0.85rem;
      padding: 0.85rem 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }
    .card:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    }
    .card:active {
      transform: translateY(0);
      background: color-mix(in srgb, var(--accent) 8%, var(--card));
    }
    .icon {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      flex-shrink: 0;
      background: var(--bg);
      object-fit: cover;
    }
    .meta {
      flex: 1;
      min-width: 0;
    }
    .name {
      font-weight: 600;
      font-size: 1rem;
      margin: 0 0 0.15rem;
      letter-spacing: -0.01em;
    }
    .desc {
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .chev {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 1.2rem;
    }

    /* Details dialog */
    dialog#details {
      border: none;
      border-radius: var(--radius);
      background: var(--card);
      color: var(--fg);
      padding: 0;
      max-width: 440px;
      width: calc(100% - 2rem);
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }
    dialog#details::backdrop {
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(2px);
    }
    .dlg-body {
      padding: 1.25rem;
    }
    .dlg-head {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }
    .dlg-head img {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      flex-shrink: 0;
      object-fit: cover;
      background: var(--bg);
    }
    .dlg-name {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 0.1rem;
      letter-spacing: -0.01em;
    }
    .dlg-author {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .dlg-desc {
      margin: 0 0 0.85rem;
      font-size: 0.95rem;
      color: var(--fg);
      white-space: pre-wrap;
    }
    .dlg-meta {
      margin: 0 0 1.25rem;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .dlg-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: color-mix(in srgb, var(--accent) 85%, black);
    }
    .btn-ghost {
      background: transparent;
      color: var(--fg);
      border-color: var(--border);
    }
    .btn-ghost:hover {
      border-color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <ul id="apps" class="apps"></ul>
  </main>

  <dialog id="details" aria-labelledby="dlg-name">
    <div class="dlg-body">
      <div class="dlg-head">
        <img id="dlg-icon" alt="" />
        <div>
          <p id="dlg-name" class="dlg-name"></p>
          <p id="dlg-author" class="dlg-author"></p>
        </div>
      </div>
      <p id="dlg-desc" class="dlg-desc"></p>
      <p id="dlg-meta" class="dlg-meta"></p>
      <div class="dlg-actions">
        <a id="dlg-install" class="btn btn-primary" href="#">Add to chat</a>
        <a id="dlg-source" class="btn btn-ghost" href="#" target="_blank" rel="noopener">View source code</a>
        <button id="dlg-close" class="btn btn-ghost" type="button">Cancel</button>
      </div>
    </div>
  </dialog>

    const list = document.getElementById("apps");
    const dlg = document.getElementById("details");
    const dlgIcon = document.getElementById("dlg-icon");
    const dlgName = document.getElementById("dlg-name");
    const dlgAuthor = document.getElementById("dlg-author");
    const dlgDesc = document.getElementById("dlg-desc");
    const dlgMeta = document.getElementById("dlg-meta");
    const dlgInstall = document.getElementById("dlg-install");
    const dlgSource = document.getElementById("dlg-source");
    const dlgClose = document.getElementById("dlg-close");

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    function openDetails(app) {
      dlgIcon.src = app.icon;
      dlgIcon.onerror = () => { dlgIcon.style.visibility = "hidden"; };
      dlgIcon.style.visibility = "visible";
      dlgName.textContent = app.name;
      dlgAuthor.textContent = "by " + app.author;
      dlgDesc.textContent = app.description;
      const metaParts = [];
      if (app.version) metaParts.push(`v${app.version}`);
      if (app.size) metaParts.push(app.size);
      dlgMeta.textContent = metaParts.join(" · ");
      dlgInstall.href = app.url;
      dlgSource.href = app.source;
      dlgSource.hidden = !app.source;
      if (typeof dlg.showModal === "function") {
        dlg.showModal();
      } else {
        dlg.setAttribute("open", "");
      }
    }

    function closeDetails() {
      if (dlg.open) dlg.close();
    }

    dlgClose.addEventListener("click", closeDetails);
    // Close when clicking the backdrop (outside the dialog body).
    dlg.addEventListener("click", (e) => {
      if (e.target === dlg) closeDetails();
    });
    // Close the dialog once the user has tapped "Add to chat" so we
    // don't sit on a stale modal after the .xdc download fires.
    dlgInstall.addEventListener("click", () => {
      setTimeout(closeDetails, 0);
    });

    for (const app of APPS) {
      const li = document.createElement("li");
      li.innerHTML = `
        <button class="card" type="button">
          <img class="icon" src="${esc(app.icon)}" alt="" />
          <div class="meta">
            <p class="name">${esc(app.name)}</p>
            <p class="desc">${esc(app.short)}</p>
          </div>
          <span class="chev" aria-hidden="true">›</span>
        </button>
      `;
      li.querySelector("button").addEventListener("click", () => openDetails(app));
      list.appendChild(li);
    }
  </script>
</body>
